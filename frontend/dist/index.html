<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <script type="module" crossorigin src="/assets/index-D48bo2vP.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BQgTRbpu.css">
  </head>
  <body>
    <div id="root">
      <div style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background: linear-gradient(135deg, #1E5F3F 0%, #123B27 100%);
        font-family: system-ui, -apple-system, sans-serif;
        color: #ffffff;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 99999;
      ">
        <style>
          .loader-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
          }
          .loader-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #a7f3d0;
            border-radius: 50%;
            animation: loader-spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
          }
          .loader-paw {
            font-size: 2.8rem;
            animation: loader-pulse 1.8s ease-in-out infinite;
          }
          .loader-title {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin: 0;
            background: linear-gradient(to right, #ffffff, #a7f3d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
          }
          .loader-subtitle {
            font-size: 0.85rem;
            color: #a7f3d0;
            margin-top: 6px;
            opacity: 0.85;
            font-weight: 500;
          }
          @keyframes loader-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
          @keyframes loader-pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.15); opacity: 1; }
          }
        </style>
        <div class="loader-container">
          <div class="loader-ring"></div>
          <div class="loader-paw">🐾</div>
        </div>
        <h1 class="loader-title">ResQ Paws</h1>
        <p class="loader-subtitle">Loading rescue station...</p>
      </div>
    </div>
  </body>
</html>
